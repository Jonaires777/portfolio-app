services:
  mongodb:
    image: mongo:5.0.27
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example

  backend:
    image: back:latest
    build: backend
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/insight-challenge?authSource=admin
      - MONGO_DATABSE=insight-challenge
      - JWT_SECRET=troque-este-segredo-local-por-um-valor-longo
      - FRONTEND_URL=http://localhost:3000

  frontend:
    image: front:latest
    build:
      context: frontend-app
      args:
        # O navegador acessa a API pela maquina host, nao pela rede do Docker
        - REACT_APP_BASE_URL=http://localhost:8080
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
