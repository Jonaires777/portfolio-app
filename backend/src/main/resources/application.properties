spring.application.name=backend
spring.data.mongodb.database=${MONGO_DATABSE:insight-challenge}
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/insight-challenge}
spring.data.mongodb.auto-index-creation=true

server.forward-headers-strategy=framework

app.frontend-url=${FRONTEND_URL:https://insight-challenge-snowy.vercel.app}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://insight-challenge-snowy.vercel.app,http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Insight Hub <onboarding@resend.dev>}
app.password-reset.expiration-minutes=30

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
